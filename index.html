<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SX Store - Verificación de Pedido</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #12141c;
            --border-color: #1f2330;
            --accent-red: #ff334b;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .checkout-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Izquierdo */
        .left-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .game-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .game-logo {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            object-fit: cover;
        }

        .game-title h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            font-style: italic;
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            background: #171a24;
        }

        .badge.green {
            color: var(--accent-green);
            border-color: rgba(0, 230, 118, 0.3);
        }

        /* Stepper superior dentro del panel */
        .steps-indicator {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .step-pill {
            font-size: 12px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #171a24;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .step-pill.active {
            background: linear-gradient(135deg, #ff334b, #ff6b6b);
            color: white;
            border: none;
        }

        .form-section h2 {
            font-size: 15px;
            color: var(--accent-red);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-red);
        }

        .char-count {
            position: absolute;
            right: 15px;
            bottom: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .verify-btn {
            background: #1a1e29;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        .verify-btn.ready {
            background: linear-gradient(135deg, #ff334b, #d9142d);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 51, 75, 0.4);
        }

        .verify-btn.ready:hover {
            opacity: 0.9;
        }

        /* Panel Derecho (Resumen) */
        .right-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            height: fit-content;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--accent-red);
            padding-left: 8px;
        }

        .product-card-mini {
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-card-mini img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .product-info h4 {
            font-size: 14px;
            font-weight: bold;
        }

        .product-info p {
            font-size: 12px;
            color: var(--accent-green);
            margin-top: 2px;
        }

        .quantity-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0c10;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-muted);
        }

        .qty-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .qty-btn {
            background: #1f2330;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: var(--accent-red);
        }

        .player-data-box {
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .totals-section {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .subtotal-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .total-row span:first-child {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-red);
        }

        .ssl-footer {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- PANEL IZQUIERDO: DINÁMICO SEGÚN EL JUEGO -->
        <div class="left-panel">
            <div class="game-header">
                <img id="gameLogo" src="" alt="Juego" class="game-logo">
                <div class="game-title">
                    <h1 id="gameName">CARGANDO...</h1>
                    <div class="badges">
                        <span class="badge">Latam</span>
                        <span class="badge green">⚡ Entrega instantánea</span>
                        <span class="badge">🔒 Pago seguro</span>
                    </div>
                </div>
            </div>

            <div class="steps-indicator">
                <div class="step-pill">1 PAQUETE</div>
                <div class="step-pill active">2 DATOS</div>
                <div class="step-pill">3 PAGO</div>
            </div>

            <div class="form-section">
                <h2 id="formTitle">2 DATOS DEL JUGADOR</h2>
                <div class="input-group">
                    <label id="inputLabel" for="playerIdInput">Ingresa tu ID</label>
                    <div class="input-wrapper">
                        <input type="text" id="playerIdInput" placeholder="Ingresa tu ID" oninput="actualizarDatos()">
                        <span class="char-count" id="charCount">0/13</span>
                    </div>
                </div>
            </div>

            <button id="verifyBtn" class="verify-btn" onclick="completarPedidoWhatsApp()">Verificar ID</button>
        </div>

        <!-- PANEL DERECHO: RESUMEN DE VENTA -->
        <div class="right-panel">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="summary-title">Resumen de Venta</div>

                <div class="product-card-mini">
                    <img id="summaryGameLogo" src="" alt="Mini Logo">
                    <div class="product-info">
                        <h4 id="summaryGameName">Juego</h4>
                        <p id="summaryPackage">Paquete</p>
                    </div>
                </div>

                <div class="quantity-control">
                    <span>Combos</span>
                    <div class="qty-btns">
                        <button class="qty-btn" onclick="cambiarCantidad(-1)">-</button>
                        <span id="quantityVal" style="color: white; font-weight: bold;">1</span>
                        <button class="qty-btn" onclick="cambiarCantidad(1)">+</button>
                    </div>
                </div>

                <div class="player-data-box">
                    Datos del jugador:<br>
                    <span id="displayPlayerId" style="color: white;">Player ID: (Pendiente)</span>
                </div>
            </div>

            <div class="totals-section">
                <div class="subtotal-row">
                    <span>Subtotal</span>
                    <span id="subtotalText">Bs. 0,00</span>
                </div>
                <div class="total-row">
                    <span>Total a Pagar</span>
                    <span class="total-amount" id="totalText">Bs. 0,00</span>
                </div>
                <div class="ssl-footer">Transacción segura SSL 🚀</div>
            </div>
        </div>
    </div>

    <script>
        // Simulamos la base de datos de los juegos y la data recibida
        // Esto lo puedes conectar fácilmente con parámetros URL (ej: ?juego=freefire&paquete=100)
        const urlParams = new URLSearchParams(window.location.search);
        const juegoKey = urlParams.get('juego') || 'freefire';
        const paqueteKey = urlParams.get('paq') || '100';

        // Configuración de Catálogo por Juego
        const catalogoJuegos = {
            'freefire': {
                nombre: 'FREE FIRE',
                logo: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150', // Reemplaza con tu enlace o asset local
                labelInput: 'Ingresa tu ID de Free Fire',
                placeholderInput: 'Ej: 123456789',
                paqueteNombre: '💎 100 + 10 Diamantes',
                precioUnitario: 816.76
            },
            'roblox': {
                nombre: 'ROBLOX',
                logo: 'https://images.unsplash.com/photo-1612287233202-b51a36616763?w=150',
                labelInput: 'Ingresa tu Usuario de Roblox',
                placeholderInput: 'Ej: TuUsuario123',
                paqueteNombre: 'robux 400 Robux',
                precioUnitario: 550.00
            },
            'cod': {
                nombre: 'CALL OF DUTY',
                logo: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=150',
                labelInput: 'Ingresa tu ID de COD Mobile',
                placeholderInput: 'Ej: CODPlayer99',
                paqueteNombre: 'CP 880 पॉइंट्स',
                precioUnitario: 950.00
            }
        };

        // Seleccionar datos actuales
        let datosJuego = catalogoJuegos[juegoKey] || catalogoJuegos['freefire'];
        let cantidadCombos = 1;
        let idIngresado = "";

        // Inicializar la interfaz visual
        document.getElementById('gameLogo').src = datosJuego.logo;
        document.getElementById('summaryGameLogo').src = datosJuego.logo;
        document.getElementById('gameName').innerText = datosJuego.nombre;
        document.getElementById('summaryGameName').innerText = datosJuego.nombre;
        document.getElementById('formTitle').innerText = `2 DATOS DEL ${datosJuego.nombre}`;
        document.getElementById('inputLabel').innerText = datosJuego.labelInput;
        document.getElementById('playerIdInput').placeholder = datosJuego.placeholderInput;
        document.getElementById('summaryPackage').innerText = datosJuego.paqueteNombre;

        actualizarCalculos();

        function actualizarDatos() {
            const input = document.getElementById('playerIdInput');
            idIngresado = input.value.trim();
            document.getElementById('charCount').innerText = `${idIngresado.length}/13`;
            
            const display = document.getElementById('displayPlayerId');
            const btn = document.getElementById('verifyBtn');

            if(idIngresado.length > 3) {
                display.innerText = `Player ID: ${idIngresado}`;
                btn.classList.add('ready');
                btn.innerText = "Verificar ID y Continuar a WhatsApp";
            } else {
                display.innerText = `Player ID: (Pendiente)`;
                btn.classList.remove('ready');
                btn.innerText = "Verificar ID";
            }
        }

        function cambiarCantidad(cambio) {
            cantidadCombos += cambio;
            if(cantidadCombos < 1) cantidadCombos = 1;
            document.getElementById('quantityVal').innerText = cantidadCombos;
            actualizarCalculos();
        }

        function actualizarCalculos() {
            let total = datosJuego.precioUnitario * cantidadCombos;
            let formatoTotal = `Bs. ${total.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('subtotalText').innerText = formatoTotal;
            document.getElementById('totalText').innerText = formatoTotal;
        }

        function completarPedidoWhatsApp() {
            if(idIngresado.length < 3) {
                alert("Por favor ingresa un ID válido antes de continuar.");
                return;
            }

            // Armamos el mensaje para WhatsApp tal como lo manejas en tus automatizaciones
            let numeroWhatsApp = "584120000000"; // Reemplaza con tu número de WhatsApp de SX Store
            let mensaje = `Hola *SX Store* 👋,%0A` +
                          `Quiero confirmar un pedido:%0A%0A` +
                          `🎮 *Juego:* ${datosJuego.nombre}%0A` +
                          `📦 *Paquete:* ${datosJuego.paqueteNombre}%0A` +
                          `🔢 *Cantidad:* ${cantidadCombos}%0A` +
                          `🆔 *ID / Datos:* ${idIngresado}%0A` +
                          `💰 *Total a Pagar:* ${document.getElementById('totalText').innerText}%0A%0A` +
                          `Quedo atento para realizar el pago.`;

            // Redirigir a WhatsApp
            window.location.href = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;
        }
    </script>
</body>
</html>
